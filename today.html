<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B54FF">
<title>斯奈山半島導覽</title>
<link rel="stylesheet" href="./vendor/leaflet.css">
<style>
/* 版面：上半地圖、下半可捲動的導覽面板；提醒橫幅浮在地圖上方 */
:root {
  --bg: #F4F5F9; --surface: #FFFFFF; --surface-2: #EBEEF5;
  --ink: #0E1116; --ink-2: #3B4252; --ink-3: #687083; --line: #E1E4EC;
  --accent: #2B54FF; --accent-soft: #E6ECFF; --on-accent: #FFFFFF;
  --go: #087F50; --go-soft: #DDF5E9; --warn: #B45A00; --warn-soft: #FFF1DE;
  --is: #007E77; --done: #A3A9B6;
  --shadow: 0 1px 2px rgba(14,17,22,.06), 0 6px 18px rgba(14,17,22,.10);
  --font: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
  --num: "Jost", "SF Pro Rounded", ui-rounded, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1016; --surface: #171B23; --surface-2: #222833;
  --ink: #F1F3F8; --ink-2: #C3C8D4; --ink-3: #8D94A5; --line: #2A303C;
  --accent: #6F8BFF; --accent-soft: #1E2A55; --on-accent: #0D1016;
  --go: #4CD39A; --go-soft: #123326; --warn: #FFB25C; --warn-soft: #3A2810;
  --is: #3CC9BF; --done: #545B69; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1016; --surface: #171B23; --surface-2: #222833;
  --ink: #F1F3F8; --ink-2: #C3C8D4; --ink-3: #8D94A5; --line: #2A303C;
  --accent: #6F8BFF; --accent-soft: #1E2A55; --on-accent: #0D1016;
  --go: #4CD39A; --go-soft: #123326; --warn: #FFB25C; --warn-soft: #3A2810;
  --is: #3CC9BF; --done: #545B69; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-text-size-adjust: 100% }
.app { height: 100%; display: grid; grid-template-rows: minmax(220px, 44%) 1fr }
#map { position: relative; background: var(--surface-2) }
.sheet { overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg);
  padding-block: 12px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px }
.topbar { position: absolute; z-index: 800; left: 0; right: 0; top: 0;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none }
.pill { pointer-events: auto; background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px;
  box-shadow: var(--shadow); font-size: 13px; font-weight: 700; white-space: nowrap; border: 0 }
.pill .n { font-family: var(--num); font-variant-numeric: tabular-nums }
.spacer { flex: 1 }
button.pill { cursor: pointer }
button.pill[aria-pressed="true"] { background: var(--accent); color: var(--on-accent) }
.banner { position: absolute; z-index: 900; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: 12px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start }
.banner b { font-size: 16px }
.banner p { margin: 0; grid-column: 1; font-size: 14px; color: inherit; opacity: .88 }
.banner button { grid-row: 1 / span 2; grid-column: 2; background: transparent; color: inherit; border: 1px solid currentColor;
  border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; opacity: .8 }
h2 { margin: 0; font-size: 12px; letter-spacing: .08em; color: var(--ink-3); font-weight: 700 }
.card { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 8px }
.next-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
.next-name { font-size: 22px; font-weight: 900; line-height: 1.2; text-wrap: balance }
.next-name small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-3) }
.big { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 700; line-height: 1 }
.big small { font-size: 14px; font-weight: 600; color: var(--ink-3); margin-left: 2px }
.stats { display: flex; gap: 8px; flex-wrap: wrap }
.chip { background: var(--surface-2); border-radius: 8px; padding: 4px 9px; font-size: 13px; color: var(--ink-2) }
.chip .n { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink) }
.chip.late { background: var(--warn-soft); color: var(--warn) } .chip.late .n { color: var(--warn) }
.chip.ok { background: var(--go-soft); color: var(--go) } .chip.ok .n { color: var(--go) }
.desc { margin: 0; color: var(--ink-2) }
.tips { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 2px }
.btns { display: flex; gap: 8px; flex-wrap: wrap }
a.btn, button.btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; border: 0; cursor: pointer;
  background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 10px }
a.btn.ghost, button.btn.ghost { background: var(--accent-soft); color: var(--accent) }
.ahead { list-style: none; margin: 0; padding: 0; display: grid }
.ahead li { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line) }
.ahead li:first-child { border-top: 0 }
.ahead .km { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; color: var(--accent) }
.ahead .t { font-weight: 700 } .ahead .s { font-size: 13px; color: var(--ink-3) }
.kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 5px; margin-right: 4px; vertical-align: 1px }
.k-stop { background: var(--accent); color: var(--on-accent) } .k-fuel { background: var(--go-soft); color: var(--go) }
.k-view { background: var(--surface-2); color: var(--is) } .k-warn { background: var(--warn-soft); color: var(--warn) }
.k-food { background: var(--surface-2); color: var(--ink-2) }
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 0 }
.plan li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line) }
.plan li:first-child { border-top: 0 }
.plan .time { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px }
.plan .ttl { font-weight: 800 } .plan .sub { font-size: 13px; color: var(--ink-3); margin-top: 2px }
.plan li.done .time, .plan li.done .ttl { color: var(--done) }
.plan li.now .time { color: var(--accent) }
.plan details { margin-top: 6px } .plan summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 700 }
.plan details > div { display: grid; gap: 6px; margin-top: 6px }
.ctrl { display: grid; gap: 10px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
input[type=range] { width: 100%; accent-color: var(--accent) }
.muted { color: var(--ink-3); font-size: 13px; margin: 0 }
.links a { color: var(--accent) }
.stop-ic { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; border: 3px solid #fff;
  display: grid; place-items: center; font: 800 13px/1 var(--num); box-shadow: 0 2px 6px rgba(0,0,0,.35) }
.stop-ic.done { background: #8C93A3 }
.leaflet-container { font: 13px/1.4 var(--font) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
@media (min-width: 900px) { .app { grid-template-rows: 1fr; grid-template-columns: 1fr 420px } }
</style>
</head>
<body>
<div class="app">
  <div id="map">
    <div class="topbar">
      <span class="pill">冰島 <span class="n" id="clock">--:--</span></span>
      <span class="pill" id="sunPill">日落 <span class="n">18:00</span></span>
      <span class="spacer"></span>
      <button class="pill" id="followBtn" aria-pressed="true">跟著我</button>
    </div>
    <div class="banner" id="banner" hidden><b id="bTitle"></b><p id="bText"></p><button id="bClose" type="button">知道了</button></div>
  </div>

  <div class="sheet">
    <section class="card" id="nextCard" aria-live="polite">
      <div class="next-top">
        <div class="next-name" id="nextName">讀取位置中…</div>
        <div class="big" id="nextKm"></div>
      </div>
      <div class="stats" id="nextStats"></div>
      <p class="desc" id="nextDesc"></p>
      <ul class="tips" id="nextTips"></ul>
      <div class="btns" id="nextBtns"></div>
    </section>

    <section class="card">
      <h2>接下來路上</h2>
      <ul class="ahead" id="aheadList"></ul>
    </section>

    <section class="card ctrl">
      <h2>導覽設定</h2>
      <div class="row">
        <button class="btn ghost" id="voiceBtn" type="button" aria-pressed="false">開啟語音提醒</button>
        <button class="btn ghost" id="wakeBtn" type="button" aria-pressed="false">螢幕保持亮著</button>
      </div>
      <p class="muted" id="gpsState">GPS：等待授權</p>
      <label for="sim" class="muted">預覽模式：拖動滑桿模擬走到路線上的任何位置（不影響 GPS 紀錄）</label>
      <input type="range" id="sim" min="0" max="100" value="0">
      <div class="row"><button class="btn ghost" id="gpsBtn" type="button" hidden>回到 GPS 定位</button></div>
    </section>

    <section class="card">
      <h2>今天的行程 · 10/19</h2>
      <ol class="plan" id="plan"></ol>
    </section>

    <section class="card links">
      <h2>出發前、路上隨時查</h2>
      <p class="desc">路況與封路：<a href="https://umferdin.is/en" target="_blank" rel="noopener">umferdin.is</a>
        · 天氣與強風：<a href="https://en.vedur.is/" target="_blank" rel="noopener">vedur.is</a>
        · 緊急電話 <b>112</b></p>
      <p class="muted">路線依 OpenStreetMap 道路計算，車程是估計值；距離是「沿著路線還要開多遠」。手機鎖螢幕或切到別的 App 時，瀏覽器會暫停定位，提醒要回到這頁才會跳出來。</p>
    </section>
  </div>
</div>

    say: "前方是 Djúpalónssandur 黑珍珠沙灘，從主線轉進去約 2 公里。浪很危險，不要靠近水邊。沙灘上有 1948 年船難留下的鐵件。" },
  { k: "view", zh: "Saxhóll 火山口", lat: 64.8517, lon: -23.9265, at: 2,
    say: "前方是 Saxhóll 火山口，就在路旁，走鐵梯步道大約 10 分鐘可以上去看。" },
  { k: "fuel", zh: "Ólafsvík 加油站", lat: 64.8943, lon: -23.7090, at: 2,
    say: "前方 Ólafsvík 鎮上有加油站。" },
  { k: "fuel", zh: "Grundarfjörður 最後補給", lat: 64.9245, lon: -23.2600, at: 2,
    say: "前方 Grundarfjörður 是回程前最後一個鎮，記得加油、上廁所，接下來要開大約兩個半小時。" },
  { k: "warn", zh: "56 號公路翻山段", lat: 64.9050, lon: -22.8400, at: 4,
    say: "前方要走 56 號公路翻山，天黑後風大、路面可能結冰，請放慢速度。" },
  { k: "fuel", zh: "Borgarnes 回程休息", lat: 64.5386, lon: -21.9206, at: 3,
    say: "快到 Borgarnes，可以在這裡休息加油，剩大約一個小時到雷克雅維克。" },
  { k: "warn", zh: "Hvalfjörður 海底隧道", lat: 64.3780, lon: -21.7770, at: 3,
    say: "前方是海底隧道，過了隧道大約再 40 分鐘到雷克雅維克。" },
];
const KIND = { stop: "停靠", fuel: "補給", view: "順停", warn: "注意", food: "吃飯" };

// ── 工具
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toMin = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };
const fmt = (min) => { min = ((Math.round(min) % 1440) + 1440) % 1440; return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); };
const nowMin = () => { const d = new Date(); return d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60; }; // 冰島＝UTC
const km = (la1, lo1, la2, lo2) => { const x = (lo2 - lo1) * Math.cos((la1 + la2) * Math.PI / 360) * 111.32, y = (la2 - la1) * 110.54; return Math.hypot(x, y); };
const store = {
  get(k, d) { try { const v = localStorage.getItem("snae-1019-" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("snae-1019-" + k, JSON.stringify(v)); } catch { /* 無痕模式略過 */ } },
};
const navUrl = (p) => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=driving`;

// ── 路線累計距離，並把每個點對到路線上（依順序往後找，避免去回程重疊時對錯邊）
const CUM = [0];
for (let i = 1; i < ROUTE.length; i++) CUM.push(CUM[i - 1] + km(ROUTE[i - 1][0], ROUTE[i - 1][1], ROUTE[i][0], ROUTE[i][1]));
function snapFrom(p, from) {
  let best = Infinity;
  const ds = [];
  for (let i = from; i < ROUTE.length; i++) { const d = km(p.lat, p.lon, ROUTE[i][0], ROUTE[i][1]); ds.push(d); if (d < best) best = d; }
  for (let j = 0; j < ds.length; j++) if (ds[j] <= best + 0.3) return from + j;
  return from;
}
let cursor = 0;
const ITEMS = [];
{ // 合併主要停靠點與提醒點，依路線順序排好
  const seq = [STOPS[0], POIS[0], POIS[1], POIS[2], STOPS[1], STOPS[2], POIS[3], POIS[4], POIS[5], POIS[6], POIS[7], STOPS[3], POIS[8], STOPS[4], POIS[9], POIS[10], POIS[11], POIS[12], STOPS[5]];
  for (const p of seq) {
    if (p.id === "home") p.idx = ROUTE.length - 1; else p.idx = snapFrom(p, cursor);
    cursor = p.idx;
    p.isStop = !!p.id; p.kind = p.isStop ? "stop" : p.k;
    ITEMS.push(p);
  }
}

// ── 地圖
let map = null, youDot = null, youAcc = null, passedLine = null, follow = true;
const stopMarkers = {};
if (window.L) {
  map = L.map("map", { zoomControl: false, attributionControl: true }).fitBounds(ROUTE, { padding: [20, 20] });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2B54FF";
  L.polyline(ROUTE, { color: accent, weight: 5, opacity: .85 }).addTo(map);
  passedLine = L.polyline([], { color: "#8C93A3", weight: 6, opacity: .9 }).addTo(map);
  const colors = { fuel: "#087F50", view: "#007E77", warn: "#B45A00", food: "#6B4FD8" };
  for (const p of POIS) {
    L.circleMarker([p.lat, p.lon], { radius: 7, color: "#fff", weight: 2, fillColor: colors[p.k], fillOpacity: 1 })
      .bindPopup(`<b>${esc(p.zh)}</b><br>${esc(p.say)}<br><a href="${navUrl(p)}" target="_blank" rel="noopener">Google 導航</a>`).addTo(map);
  }
  for (const s of STOPS) {
    if (s.id === "home") continue;
    const m = L.marker([s.lat, s.lon], { icon: L.divIcon({ className: "", html: `<div class="stop-ic">${s.n || "起"}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }) })
      .bindPopup(`<b>${s.n ? s.n + ". " : ""}${esc(s.zh)}</b>${s.en ? "<br>" + esc(s.en) : ""}<br>${s.a}${s.d !== s.a ? "–" + s.d : ""}<br><a href="${navUrl(s)}" target="_blank" rel="noopener">Google 導航</a>`).addTo(map);
    stopMarkers[s.id] = m;
  }
  youAcc = L.circle([0, 0], { radius: 1, color: accent, weight: 1, fillOpacity: .12, opacity: .4 });
  youDot = L.circleMarker([0, 0], { radius: 8, color: "#fff", weight: 3, fillColor: accent, fillOpacity: 1 });
  map.on("dragstart", () => setFollow(false));
} else {
  $("map").insertAdjacentHTML("beforeend", '<p class="muted" style="padding:60px 16px">地圖需要網路才能載入，下方導覽仍可使用。</p>');
}
function setFollow(v) { follow = v; $("followBtn").setAttribute("aria-pressed", String(v)); }
$("followBtn").onclick = () => { setFollow(!follow); if (follow && last) map?.setView([last.lat, last.lon], Math.max(map.getZoom(), 11)); };

// ── 目前位置 → 路線進度
let progIdx = store.get("idx", null);
let last = null, sim = false, offKm = 0;
function locate(lat, lon) {
  let best = Infinity;
  const ds = new Float64Array(ROUTE.length);
  for (let i = 0; i < ROUTE.length; i++) { ds[i] = km(lat, lon, ROUTE[i][0], ROUTE[i][1]); if (ds[i] < best) best = ds[i]; }
  const cands = [];
  for (let i = 0; i < ROUTE.length; i++) if (ds[i] <= best + 0.5) cands.push(i);
  let pick;
  if (progIdx === null) pick = nowMin() < toMin("15:00") ? cands[0] : cands[cands.length - 1];
  else {
    const fwd = cands.filter((i) => i >= progIdx - 40);
    const pool = fwd.length ? fwd : cands;
    pick = pool.reduce((a, b) => (Math.abs(b - progIdx) < Math.abs(a - progIdx) ? b : a));
  }
  return { idx: pick, off: best };
}

// ── 語音與提醒
let voice = store.get("voice", false);
function speak(text) {
  if (!voice || !("speechSynthesis" in window)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "zh-TW"; u.rate = 1; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch { /* 略過 */ }
}
function showBanner(title, text) {
  $("bTitle").textContent = title; $("bText").textContent = text; $("banner").hidden = false;
  try { navigator.vibrate?.([200, 100, 200]); } catch { /* 略過 */ }
  speak(title + "。" + text);
}
$("bClose").onclick = () => { $("banner").hidden = true; };
const alerted = new Set(store.get("alerted", []));
const simAlerted = new Set();
function fire(key, title, text) {
  const set = sim ? simAlerted : alerted;
  if (set.has(key)) return;
  set.add(key);
  if (!sim) store.set("alerted", [...alerted]);
  showBanner(title, text);
}
function setVoiceBtn() { $("voiceBtn").setAttribute("aria-pressed", String(voice)); $("voiceBtn").textContent = voice ? "語音提醒：開" : "開啟語音提醒"; }
setVoiceBtn();
$("voiceBtn").onclick = () => { voice = !voice; store.set("voice", voice); setVoiceBtn(); if (voice) speak("語音提醒已開啟，快到景點時我會提醒你。"); };

let wake = null;
async function setWake(on) {
  try {
    if (on) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; paintWake(); }); }
    else { await wake?.release(); wake = null; }
  } catch { wake = null; $("gpsState").textContent = "這個瀏覽器不支援螢幕常亮，請到手機設定把自動鎖定時間調長。"; }
  paintWake();
}
function paintWake() { $("wakeBtn").setAttribute("aria-pressed", String(!!wake)); $("wakeBtn").textContent = wake ? "螢幕常亮：開" : "螢幕保持亮著"; }
$("wakeBtn").onclick = () => setWake(!wake);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("wakeBtn").dataset.want === "1" && !wake) setWake(true); });
$("wakeBtn").addEventListener("click", () => { $("wakeBtn").dataset.want = wake ? "0" : "1"; });

// ── 畫面更新
function render() {
  const t = nowMin();
  $("clock").textContent = fmt(t);
  const toSun = toMin("18:00") - t;
  $("sunPill").innerHTML = toSun > 0 && toSun <= 90 ? `日落還有 <span class="n">${Math.round(toSun)}</span> 分` : `日落 <span class="n">18:00</span>`;
  if (toSun <= 30 && toSun > 0) fire("sunset", "30 分鐘後日落", "天色會很快變暗，山路請放慢速度，記得開大燈。");

  const idx = progIdx ?? 0;
  const here = CUM[idx];

  // 下一個主要停靠點；距離 0.4 km 內視為「已抵達」
  const stops = ITEMS.filter((p) => p.isStop && p.id !== "rvk");
  let at = stops.find((s) => Math.abs(CUM[s.idx] - here) < 0.4 && offKm < 1);
  let next = stops.find((s) => s.idx > idx && CUM[s.idx] - here >= 0.4) || stops[stops.length - 1];
  const target = at || next;
  const ahead = Math.max(0, CUM[target.idx] - here);
  const distKm = offKm > 2 ? km(last?.lat ?? 0, last?.lon ?? 0, target.lat, target.lon) : ahead;

  $("nextName").innerHTML = at
    ? `<small>你在第 ${at.n} 站</small>${esc(at.zh)}`
    : `<small>下一站${target.n ? " · 第 " + target.n + " 站" : ""}${target.en ? " · " + esc(target.en) : ""}</small>${esc(target.zh)}`;
  const stats = [];
  if (at) {
    $("nextKm").innerHTML = "";
    const left = toMin(at.d) - t;
    if (at.id === "home") stats.push(`<span class="chip ok">今天的行程走完了，辛苦了！</span>`);
    else if (sim) stats.push(`<span class="chip">計畫 <span class="n">${at.a}–${at.d}</span></span>`);
    else stats.push(`<span class="chip">計畫 <span class="n">${at.d}</span> 離開</span>`, left >= 0 ? `<span class="chip ok">還可以待 <span class="n">${Math.round(left)}</span> 分</span>` : `<span class="chip late">已超過 <span class="n">${Math.round(-left)}</span> 分，該出發了</span>`);
    fire("arrive-" + at.id, "抵達 " + at.zh, at.desc);
  } else {
    $("nextKm").innerHTML = `${distKm < 10 ? distKm.toFixed(1) : Math.round(distKm)}<small>km</small>`;
    const eta = t + (distKm / (target.speed || 70)) * 60;
    const diff = Math.round(eta - toMin(target.a));
    stats.push(`<span class="chip">預計 <span class="n">${fmt(eta)}</span> 到</span>`);
    stats.push(`<span class="chip">計畫 <span class="n">${target.a}</span></span>`);
    if (sim) { /* 預覽模式不比對時間 */ }
    else if (diff > 5) stats.push(`<span class="chip late">晚 <span class="n">${diff}</span> 分</span>`);
    else if (diff < -5) stats.push(`<span class="chip ok">早 <span class="n">${-diff}</span> 分</span>`);
    else stats.push(`<span class="chip ok">準時</span>`);
    if (!sim && diff > 20 && target.id !== "home") stats.push(`<span class="chip late">可以縮短這站或下一站的停留</span>`);
    if (offKm > 2) stats.push(`<span class="chip late">離規劃路線 <span class="n">${offKm.toFixed(1)}</span> km，顯示直線距離</span>`);
    if (ahead <= 5 && ahead > 0.4) fire("near-" + target.id, `${target.zh}快到了`, `還有 ${ahead.toFixed(1)} 公里。${target.desc}`);
  }
  $("nextStats").innerHTML = stats.join("");
  $("nextDesc").textContent = target.desc;
  $("nextTips").innerHTML = target.tips.map((x) => `<li>${esc(x)}</li>`).join("");
  $("nextBtns").innerHTML = `<a class="btn" href="${navUrl(target)}" target="_blank" rel="noopener">Google 導航到這裡</a>`;

  // 路上提醒
  const up = ITEMS.filter((p) => p.idx > idx && p.id !== "rvk").slice(0, 5);
  $("aheadList").innerHTML = up.map((p) => {
    const d = CUM[p.idx] - here;
    return `<li><span class="km">${d < 10 ? d.toFixed(1) : Math.round(d)} km</span><div><div class="t"><span class="kind k-${p.kind}">${KIND[p.kind]}</span>${esc(p.zh)}</div><div class="s">${esc(p.isStop ? p.desc : p.say)}</div></div></li>`;
  }).join("") || '<li><span class="km">—</span><div class="t">今天的行程都走完了，辛苦了！</div></li>';
  for (const p of ITEMS) {
    if (p.isStop) continue;
    const d = CUM[p.idx] - here;
    if (d > 0 && d <= p.at && offKm < 3) fire("poi-" + p.idx, p.zh, p.say);
  }

  // 行程表狀態
  $("plan").innerHTML = STOPS.map((s) => {
    const it = ITEMS.find((p) => p.id === s.id);
    const done = s.id === "rvk" ? idx > 30 : (it.idx < idx && !(at && at.id === s.id) && CUM[idx] - CUM[it.idx] > 0.4);
    const cls = done ? "done" : (s === target ? "now" : "");
    const time = s.a === s.d ? s.a : `${s.a}–${s.d}`;
    return `<li class="${cls}"><div class="time">${time}</div><div><div class="ttl">${s.n ? s.n + ". " : ""}${esc(s.zh)}</div>${s.en ? `<div class="sub">${esc(s.en)}</div>` : ""}${s.sub ? `<div class="sub">${esc(s.sub)}</div>` : ""}
      <details><summary>介紹與提醒</summary><div><p class="desc">${esc(s.desc)}</p><ul class="tips">${s.tips.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="btns"><a class="btn ghost" href="${navUrl(s)}" target="_blank" rel="noopener">Google 導航</a></div></div></details></div></li>`;
  }).join("");
  for (const s of STOPS) {
    const it = ITEMS.find((p) => p.id === s.id);
    stopMarkers[s.id]?.getElement()?.firstElementChild?.classList.toggle("done", it.idx < idx - 5);
  }
  passedLine?.setLatLngs(ROUTE.slice(0, idx + 1));
}

function update(lat, lon, acc) {
  last = { lat, lon };
  const r = locate(lat, lon);
  progIdx = r.idx; offKm = r.off;
  if (!sim) store.set("idx", progIdx);
  if (map) {
    youDot.setLatLng([lat, lon]).addTo(map);
    youAcc.setLatLng([lat, lon]).setRadius(acc || 1).addTo(map);
    if (follow) map.setView([lat, lon], Math.max(map.getZoom(), 10), { animate: true });
  }
  render();
}

// ── GPS
let watchId = null;
function startGps() {
  if (!("geolocation" in navigator)) { $("gpsState").textContent = "GPS：這個瀏覽器不支援定位，可以用下面的預覽滑桿。"; return; }
  watchId = navigator.geolocation.watchPosition((g) => {
    if (sim) return;
    $("gpsState").textContent = `GPS：已定位（誤差約 ${Math.round(g.coords.accuracy)} 公尺）· ${fmt(nowMin())} 更新`;
    update(g.coords.latitude, g.coords.longitude, g.coords.accuracy);
  }, (e) => {
    $("gpsState").textContent = e.code === 1 ? "GPS：沒有定位權限。iPhone 到「設定 › 隱私權 › 定位服務 › Safari」打開。" : "GPS：暫時抓不到訊號，會自動重試。";
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
}

// ── 預覽滑桿
const simEl = $("sim");
simEl.max = String(ROUTE.length - 1);
simEl.value = String(progIdx ?? 0);
simEl.addEventListener("input", () => {
  if (!sim) { sim = true; simAlerted.clear(); $("gpsBtn").hidden = false; }
  const i = Number(simEl.value);
  progIdx = i;
  update(ROUTE[i][0], ROUTE[i][1], 20);
});
$("gpsBtn").onclick = () => {
  sim = false; $("gpsBtn").hidden = true; $("banner").hidden = true;
  progIdx = store.get("idx", null);
  $("gpsState").textContent = "GPS：重新定位中…";
  render();
};

render();
startGps();
setInterval(render, 30000);

// 離線：註冊主 App 的 service worker，第二次打開起沒訊號也能看行程
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(() => navigator.serviceWorker.ready).then(() => {
    for (const u of ["./today.html", "./vendor/leaflet.js", "./vendor/leaflet.css"]) fetch(u).catch(() => {});
  }).catch(() => {});
}
</script>
</body>
</html>
